aid: thea-energy
name: Thea Energy
description: 'Thea Energy, Inc. is a fusion energy company headquartered in Kearny, New
  Jersey, founded in 2022 on stellarator physics and engineering developed at Princeton
  University and the Princeton Plasma Physics Laboratory. Thea is reinventing the stellarator
  by replacing complex, hand-wound 3D modular coils with a phased array of simple planar
  electromagnetic coils, moving the complexity of shaping the magnetic field out of the
  hardware and into a software control stack that can be tuned over an asset''s lifetime.
  Its first integrated machine, Eos, is a steady-state, neutron-producing stellarator; the
  follow-on Helios is intended to be an electricity-producing plant. The company raised a
  $100M Series B in May 2026 led by Thomas Tull''s US Innovative Technology Fund, and the
  U.S. Department of Energy has certified its power plant preconceptual design milestone.
  Thea publishes no public API, developer portal, or machine-readable contract; its only
  public software surface is a small set of open-source nuclear-engineering and simulation
  libraries on GitHub.'
